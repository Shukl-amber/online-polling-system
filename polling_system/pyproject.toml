[project]
name = "polling-system-backend"
version = "1.0.0"
description = "Online Polling System - AWS Serverless Backend"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N815",   # mixedCase variables in class scope (API schemas)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ARG001", "S101", "I001"]
"backend/conftest.py" = ["ARG001", "S101"]
"**/handler.py" = ["ARG001"]
"scripts/*" = ["T201", "W291", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "features"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
